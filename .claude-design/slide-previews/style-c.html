<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style C: Neon Cyber</title>
    <link rel="stylesheet"
        href="https://api.fontshare.com/v2/css?f[]=clash-display@700,600&f[]=satoshi@400,700&display=swap">
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --accent: #10b981;
            --font-display: 'Clash Display', sans-serif;
            --font-body: 'Satoshi', sans-serif;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .container {
            text-align: center;
            opacity: 0;
            transform: translateX(-50px);
            animation: reveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 5.5rem;
            margin: 0;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .accent {
            color: var(--accent);
        }

        .grid-line {
            width: 300px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin: 2rem auto;
        }

        .status {
            font-size: 0.8rem;
            font-family: monospace;
            color: var(--accent);
            letter-spacing: 0.3em;
        }

        @keyframes reveal {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="status">SYSTEM INITIALIZED // V2.0</div>
        <h1>YANGO <span class="accent">INTELLIGENCE</span></h1>
        <div class="grid-line"></div>
        <p>Instant Due Diligence Scrutiny</p>
    </div>
</body>

</html>
