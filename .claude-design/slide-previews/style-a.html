<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style A: Corporate Elegant</title>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@700,600&f[]=satoshi@400,700&display=swap">
    <style>
        :root {
            --bg: #ffffff;
            --text: #0f172a;
            --accent: #dc2626;
            --font-display: 'Clash Display', sans-serif;
            --font-body: 'Satoshi', sans-serif;
        }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            animation: reveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        h1 {
            font-family: var(--font-display);
            font-size: 5rem;
            margin: 0;
            letter-spacing: -0.02em;
        }
        .accent { color: var(--accent); }
        p {
            font-size: 1.5rem;
            color: #64748b;
            margin-top: 1rem;
        }
        .bar {
            width: 80px;
            height: 4px;
            background: var(--accent);
            margin: 2rem auto;
        }
        @keyframes reveal {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Yango <span class="accent">DD</span></h1>
        <div class="bar"></div>
        <p>Automated Due Diligence Platform</p>
    </div>
</body>
</html>
